# =====================================================================================================
# Suwa Sarana — Production Docker Compose for AWS Free Tier (EC2 t2.micro / t3.micro with 1GB RAM)
#
# Usage:
#   1. Set environment variables in .env.production (or export them in shell)
#   2. Run: docker compose -f docker-compose.prod.yml up -d --build
# =====================================================================================================

services:
  # ---------------------------------------------------------------------------------------------------
  # PostgreSQL Database Service
  # Note: If using AWS RDS PostgreSQL Free Tier (db.t3.micro/db.t4g.micro), you can comment this block out
  # and point DB_URL in backend service to your RDS endpoint!
  # ---------------------------------------------------------------------------------------------------
  db:
    image: postgres:16.15-alpine3.23
    container_name: suwasarana-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suwa_sarana_prod}
      POSTGRES_USER: ${DB_USER:-suwa_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - suwa_sarana_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-suwa_admin} -d ${POSTGRES_DB:-suwa_sarana_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 250M

  # ---------------------------------------------------------------------------------------------------
  # Spring Boot 4 Backend Service
  # Tuned for 1GB RAM EC2 with SerialGC and conservative heap limits
  # ---------------------------------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: suwasarana-prod-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/suwa_sarana_prod}
      DB_USER: ${DB_USER:-suwa_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ALLOW_HTTP: ${ALLOW_HTTP:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-mock_key}
      SEED_DATA_ENABLED: "false"
      # JVM Tuning for 1GB Micro Instances: SerialGC has minimal memory overhead
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx350m -Xms128m -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Colombo"
    deploy:
      resources:
        limits:
          memory: 450M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ---------------------------------------------------------------------------------------------------
  # Next.js 16 Standalone Frontend Service
  # Extremely lightweight (~80-120MB RAM) running standalone server
  # ---------------------------------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: suwasarana-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    deploy:
      resources:
        limits:
          memory: 200M

  # ---------------------------------------------------------------------------------------------------
  # Nginx Reverse Proxy & Entrypoint
  # Exposes port 80 (and 443 for SSL) to the internet
  # ---------------------------------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: suwasarana-prod-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  suwa_sarana_prod_pgdata:
  certbot_conf:
  certbot_www:
