# Texts the server sends itself (SMS and email), Tamil. Same keys as auth_en. Plain, formal register.
# Lines marked "# REVIEW" contain wording a native speaker should confirm before launch.
# REVIEW: the whole file was drafted without a native-speaker pass. Check especially: verify (சரிபார்), suspend (இடைநிறுத்து), blood drive (இரத்த தான முகாம்), reviewer (மதிப்பாய்வாளர்).

# REVIEW: the product name is transliterated as below
app.name=சுவ சரண

# ---- SMS ----------------------------------------------------------------------------------------------------------
# {0} = code, {1} = minutes
sms.otp=உங்கள் சுவ சரண சரிபார்ப்புக் குறியீடு {0}. இது {1} நிமிடங்களுக்குச் செல்லுபடியாகும். இந்தக் குறியீட்டை யாருடனும் பகிர வேண்டாம்.
sms.verification.approved=சுவ சரண: உங்கள் கணக்கு சரிபார்க்கப்பட்டது. இனி நீங்கள் இரத்தக் கோரிக்கைகளையும் இரத்த தான முகாம்களையும் வெளியிடலாம்.
sms.verification.rejected=சுவ சரண: உங்கள் கணக்கைச் சரிபார்க்க இயலவில்லை. காரணத்தைப் பார்க்க உள்நுழையவும்.
sms.account.suspended=சுவ சரண: உங்கள் கணக்கு இடைநிறுத்தப்பட்டுள்ளது. ஆதரவுக் குழுவைத் தொடர்பு கொள்ளவும்.
sms.account.restored=சுவ சரண: உங்கள் கணக்கு மீண்டும் செயல்படுத்தப்பட்டது. நீங்கள் மீண்டும் உள்நுழையலாம்.

