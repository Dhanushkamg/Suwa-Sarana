# Texts the server sends itself (SMS and email), Sinhala. Same keys as auth_en. Plain, formal register.
# Lines marked "# REVIEW" contain wording a native speaker should confirm before launch.
# REVIEW: the whole file was drafted without a native-speaker pass. Check especially: verify (සත්‍යාපනය), suspend (අත්හිටුවා), blood drive (රුධිරදාන වැඩසටහන්), reviewer (සමාලෝචක).

# REVIEW: the product name is transliterated as below
app.name=සුව සරණ

# ---- SMS ----------------------------------------------------------------------------------------------------------
# {0} = code, {1} = minutes
sms.otp=ඔබේ සුව සරණ සත්‍යාපන කේතය {0} වේ. එය මිනිත්තු {1}ක් සඳහා වලංගු වේ. මෙම කේතය කිසිවකු සමඟ බෙදා නොගන්න.
sms.verification.approved=සුව සරණ: ඔබේ ගිණුම සත්‍යාපනය කර ඇත. දැන් ඔබට රුධිර ඉල්ලීම් සහ රුධිරදාන වැඩසටහන් පළ කළ හැකිය.
sms.verification.rejected=සුව සරණ: ඔබේ ගිණුම සත්‍යාපනය කිරීමට නොහැකි විය. හේතුව බැලීමට කරුණාකර පිවිසෙන්න.
sms.account.suspended=සුව සරණ: ඔබේ ගිණුම අත්හිටුවා ඇත. කරුණාකර සහාය කණ්ඩායම අමතන්න.
sms.account.restored=සුව සරණ: ඔබේ ගිණුම යළි සක්‍රිය කර ඇත. ඔබට නැවත පිවිසිය හැකිය.

# ---- email: verify address ------------------------------------------------------------------------------------------
# {0} = first name, {1} = link, {2} = hours the link stays valid
email.verify.subject=ඔබේ විද්‍යුත් තැපැල් ලිපිනය තහවුරු කරන්න - සුව සරණ
email.verify.body={0}, ආයුබෝවන්,\n\
\n\
පහත සබැඳිය විවෘත කර සුව සරණ සඳහා ඔබේ විද්‍යුත් තැපැල් ලිපිනය තහවුරු කරන්න:\n\
{1}\n\
\n\
මෙම සබැඳිය එක් වරක් පමණක් භාවිත කළ හැකි අතර පැය {2}ක් සඳහා වලංගු වේ.\n\
ඔබ ගිණුමක් සාදා නොමැති නම් මෙම පණිවිඩය නොසලකා හරින්න.\n\
\n\
සුව සරණ

# ---- email: password reset ------------------------------------------------------------------------------------------
# {0} = first name, {1} = link, {2} = minutes the link stays valid
email.reset.subject=ඔබේ මුරපදය යළි සකසන්න - සුව සරණ
email.reset.body={0}, ආයුබෝවන්,\n\
\n\
ඔබේ සුව සරණ මුරපදය යළි සැකසීමේ ඉල්ලීමක් අපට ලැබුණි. නව මුරපදයක් තෝරා ගැනීමට පහත සබැඳිය විවෘත කරන්න:\n\
{1}\n\
\n\
මෙම සබැඳිය එක් වරක් පමණක් භාවිත කළ හැකි අතර මිනිත්තු {2}ක් සඳහා වලංගු වේ.\n\
ඔබ මෙය ඉල්ලා නොමැති නම් මෙම පණිවිඩය නොසලකා හරින්න. ඔබේ මුරපදය වෙනස් නොවේ.\n\
\n\
සුව සරණ

# ---- email: administrator invitation --------------------------------------------------------------------------------
# {0} = first name (may be empty), {1} = link, {2} = hours the link stays valid
email.invite.subject=සුව සරණ පරිපාලකයකු ලෙස ඔබට ආරාධනා කර ඇත
email.invite.body={0}, ආයුබෝවන්,\n\
\n\
ඔබට සුව සරණ පරිපාලකයකු ලෙස එක්වීමට ආරාධනා කර ඇත. ඔබේ ගිණුම සෑදීමට පහත සබැඳිය විවෘත කරන්න:\n\
{1}\n\
\n\
මෙම සබැඳිය එක් වරක් පමණක් භාවිත කළ හැකි අතර පැය {2}ක් සඳහා වලංගු වේ.\n\
මෙම ආරාධනය ඔබ බලාපොරොත්තු නොවූවක් නම් මෙම පණිවිඩය නොසලකා හරින්න.\n\
\n\
සුව සරණ

# ---- email: verification decision -----------------------------------------------------------------------------------
# {0} = first name, {1} = reason given by the reviewing administrator
email.approved.subject=ඔබේ සුව සරණ ගිණුම සත්‍යාපනය කර ඇත
email.approved.body={0}, ආයුබෝවන්,\n\
\n\
ඔබේ ගිණුම සත්‍යාපනය කර ඇත. දැන් ඔබට රුධිර ඉල්ලීම් සහ රුධිරදාන වැඩසටහන් පළ කළ හැකිය.\n\
\n\
සමාලෝචකයාගේ සටහන: {1}\n\
\n\
සුව සරණ

email.rejected.subject=ඔබේ සුව සරණ ගිණුම සත්‍යාපනය කිරීමට නොහැකි විය
email.rejected.body={0}, ආයුබෝවන්,\n\
\n\
ඔබේ ගිණුම සත්‍යාපනය කිරීමට අපට නොහැකි විය.\n\
\n\
හේතුව: {1}\n\
\n\
මෙය වැරදීමක් යැයි ඔබ සිතන්නේ නම් කරුණාකර සහාය කණ්ඩායම අමතන්න.\n\
\n\
සුව සරණ

# ---- email: suspension -----------------------------------------------------------------------------------------------
email.suspended.subject=ඔබේ සුව සරණ ගිණුම අත්හිටුවා ඇත
email.suspended.body={0}, ආයුබෝවන්,\n\
\n\
ඔබේ ගිණුම අත්හිටුවා ඇත.\n\
\n\
හේතුව: {1}\n\
\n\
මෙය සමාලෝචනය කිරීමට අවශ්‍ය නම් කරුණාකර සහාය කණ්ඩායම අමතන්න.\n\
\n\
සුව සරණ

email.restored.subject=ඔබේ සුව සරණ ගිණුම යළි සක්‍රිය කර ඇත
email.restored.body={0}, ආයුබෝවන්,\n\
\n\
ඔබේ ගිණුම යළි සක්‍රිය කර ඇත. ඔබට නැවත පිවිසිය හැකිය.\n\
\n\
සුව සරණ

# ---- email: someone tried to register with an address that already has an account -----------------------------------
# {0} = first name, {1} = sign-in link, {2} = reset link
email.duplicate.subject=ඔබේ විද්‍යුත් තැපැල් ලිපිනයෙන් සුව සරණ ගිණුමක් සෑදීමට යමෙකු උත්සාහ කළේය
email.duplicate.body={0}, ආයුබෝවන්,\n\
\n\
දැනටමත් ගිණුමක් ඇති මෙම විද්‍යුත් තැපැල් ලිපිනයෙන් නව සුව සරණ ගිණුමක් සෑදීමට යමෙකු මේ දැන් උත්සාහ කළේය.\n\
\n\
එය ඔබ නම්, මෙතැනින් පිවිසෙන්න: {1}\n\
මුරපදය අමතක වී ඇත්නම්, මෙතැනින් යළි සකසන්න: {2}\n\
එය ඔබ නොවේ නම් කිසිවක් කිරීමට අවශ්‍ය නැත. ඔබේ ගිණුම වෙනස් වී නැත.\n\
\n\
සුව සරණ

