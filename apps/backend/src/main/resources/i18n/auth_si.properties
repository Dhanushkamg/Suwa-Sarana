email.deleted.subject=ඔබේ සුව සරණ ගිණුම මකා දමා ඇත
email.deleted.body={0}, ආයුබෝවන්,\n\
\n\
ඔබ ඉල්ලා සිටි පරිදි ඔබේ සුව සරණ ගිණුම මකා දමා, ඔබේ පුද්ගලික තොරතුරු ඉවත් කර ඇත.\n\
\n\
සුව සරණ
