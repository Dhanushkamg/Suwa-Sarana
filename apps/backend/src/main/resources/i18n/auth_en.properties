# Texts the server sends itself (SMS and email), English. Format: java.text.MessageFormat, so a literal apostrophe is written ''.
# Placeholders are documented per key. Sinhala (auth_si) and Tamil (auth_ta) must define exactly the same keys.

app.name=Suwa Sarana

# ---- SMS ----------------------------------------------------------------------------------------------------------
# {0} = code, {1} = minutes
sms.otp=Your Suwa Sarana verification code is {0}. It is valid for {1} minutes. Do not share it with anyone.
sms.verification.approved=Suwa Sarana: your account has been verified. You can now publish requests and donation drives.
sms.verification.rejected=Suwa Sarana: we could not verify your account. Please sign in to see the reason.
sms.account.suspended=Suwa Sarana: your account has been suspended. Please contact support.
sms.account.restored=Suwa Sarana: your account has been restored. You can sign in again.

# ---- email: verify address ------------------------------------------------------------------------------------------
# {0} = first name, {1} = link, {2} = hours the link stays valid
email.verify.subject=Confirm your email address - Suwa Sarana
email.verify.body=Hello {0},\n\
\n\
Please confirm your email address for Suwa Sarana by opening this link:\n\
{1}\n\
\n\
The link works once and stays valid for {2} hours.\n\
If you did not create an account, you can ignore this email.\n\
\n\
Suwa Sarana

# ---- email: password reset ------------------------------------------------------------------------------------------
# {0} = first name, {1} = link, {2} = minutes the link stays valid
email.reset.subject=Reset your password - Suwa Sarana
email.reset.body=Hello {0},\n\
\n\
We received a request to reset your Suwa Sarana password. Open this link to choose a new one:\n\
{1}\n\
\n\
The link works once and stays valid for {2} minutes.\n\
If you did not ask for this, ignore this email. Your password stays the same.\n\
\n\
Suwa Sarana

# ---- email: administrator invitation --------------------------------------------------------------------------------
# {0} = first name (may be empty), {1} = link, {2} = hours the link stays valid
email.invite.subject=You are invited to administer Suwa Sarana
email.invite.body=Hello {0},\n\
\n\
You have been invited to join Suwa Sarana as an administrator. Open this link to create your account:\n\
{1}\n\
\n\
The link works once and stays valid for {2} hours.\n\
If you did not expect this invitation, ignore this email.\n\
\n\
Suwa Sarana

# ---- email: verification decision -----------------------------------------------------------------------------------
# {0} = first name, {1} = reason given by the reviewing administrator
email.approved.subject=Your Suwa Sarana account is verified
email.approved.body=Hello {0},\n\
\n\
Your account has been verified. You can now publish blood requests and donation drives.\n\
\n\
Note from the reviewer: {1}\n\
\n\
Suwa Sarana

email.rejected.subject=Your Suwa Sarana account could not be verified
email.rejected.body=Hello {0},\n\
\n\
We could not verify your account.\n\
\n\
Reason: {1}\n\
\n\
If you think this is a mistake, please contact support.\n\
\n\
Suwa Sarana

# ---- email: suspension -----------------------------------------------------------------------------------------------
email.suspended.subject=Your Suwa Sarana account has been suspended
email.suspended.body=Hello {0},\n\
\n\
Your account has been suspended.\n\
\n\
Reason: {1}\n\
\n\
Please contact support if you would like this reviewed.\n\
\n\
Suwa Sarana

email.restored.subject=Your Suwa Sarana account has been restored
email.restored.body=Hello {0},\n\
\n\
Your account has been restored and you can sign in again.\n\
\n\
Suwa Sarana

# ---- email: someone tried to register with an address that already has an account -----------------------------------
# {0} = first name, {1} = sign-in link, {2} = reset link
email.duplicate.subject=Someone tried to create a Suwa Sarana account with your email
email.duplicate.body=Hello {0},\n\
\n\
Someone just tried to register a new Suwa Sarana account with this email address, which already has an account.\n\
\n\
If it was you, sign in here: {1}\n\
If you forgot your password, reset it here: {2}\n\
If it was not you, no action is needed. Your account is unchanged.\n\
\n\
Suwa Sarana

# ---- email: your data export / deletion ------------------------------------------------------------------------------
email.deleted.subject=Your Suwa Sarana account has been deleted
email.deleted.body=Hello {0},\n\
\n\
As you requested, your Suwa Sarana account has been deleted and your personal details have been erased.\n\
\n\
Suwa Sarana
