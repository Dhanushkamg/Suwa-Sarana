# Defaults for the auth / identity / SMS / email settings owned by the auth module.
# They live here (not in application.yml) so the module is self-contained; every value can be overridden by the
# environment variable shown, or by the equivalent property in application.yml / application-<profile>.yml.

# --- secrets ---------------------------------------------------------------------------------------------------
# Key for HMAC-SHA256 of OTP codes and NIC numbers. MUST be set (>= 32 random chars) in production.
app.auth.hmac-secret=${AUTH_HMAC_SECRET:dev-only-hmac-secret-do-not-use-in-production-0123456789}

# --- general ---------------------------------------------------------------------------------------------------
# one frontend URL for the whole app: app.frontend-url (platform) wins, then FRONTEND_URL
app.auth.frontend-url=${app.frontend-url:${FRONTEND_URL:http://localhost:3000}}
app.auth.consent-version=${CONSENT_VERSION:2026-01}
app.auth.admin-bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}

# --- lockout (per account, independent of IP) ------------------------------------------------------------------
app.auth.lockout.threshold=${LOCKOUT_THRESHOLD:5}
app.auth.lockout.base-seconds=${LOCKOUT_BASE_SECONDS:60}
app.auth.lockout.max-seconds=${LOCKOUT_MAX_SECONDS:3600}

# --- tokens ----------------------------------------------------------------------------------------------------
app.auth.email-verification-ttl-hours=${EMAIL_VERIFICATION_TTL_HOURS:24}
app.auth.password-reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
app.auth.admin-invite-ttl-hours=${ADMIN_INVITE_TTL_HOURS:72}
app.auth.resend-cooldown-seconds=${AUTH_RESEND_COOLDOWN_SECONDS:60}
app.auth.refresh-reuse-grace-seconds=${REFRESH_REUSE_GRACE_SECONDS:5}

# --- SMS -------------------------------------------------------------------------------------------------------
# SMS_PROVIDER=notifylk | logging   (logging = nothing is sent; dev only)
app.sms.provider=${SMS_PROVIDER:logging}
# Logging provider only: print message bodies (they contain OTP codes). Dev/local/test profiles always do.
app.sms.notifylk.base-url=${NOTIFYLK_BASE_URL:https://app.notify.lk/api/v1/send}
app.sms.notifylk.user-id=${NOTIFYLK_USER_ID:}
app.sms.notifylk.api-key=${NOTIFYLK_API_KEY:}
app.sms.notifylk.sender-id=${NOTIFYLK_SENDER_ID:NotifyDEMO}
app.sms.notifylk.connect-timeout-ms=${NOTIFYLK_CONNECT_TIMEOUT_MS:3000}
app.sms.notifylk.request-timeout-ms=${NOTIFYLK_REQUEST_TIMEOUT_MS:8000}

# --- email -----------------------------------------------------------------------------------------------------
# EMAIL_PROVIDER=smtp | logging     (logging = nothing is sent; dev only)
app.email.provider=${EMAIL_PROVIDER:logging}
app.email.from=${EMAIL_FROM:Suwa Sarana <no-reply@suwasarana.lk>}
app.email.smtp.host=${SMTP_HOST:localhost}
app.email.smtp.port=${SMTP_PORT:587}
app.email.smtp.username=${SMTP_USERNAME:}
app.email.smtp.password=${SMTP_PASSWORD:}
# starttls: upgrade a plain connection (port 587). ssl: implicit TLS from the first byte (port 465).
app.email.smtp.starttls=${SMTP_STARTTLS:true}
app.email.smtp.ssl=${SMTP_SSL:false}
app.email.smtp.connect-timeout-ms=${SMTP_CONNECT_TIMEOUT_MS:5000}
app.email.smtp.read-timeout-ms=${SMTP_READ_TIMEOUT_MS:10000}
