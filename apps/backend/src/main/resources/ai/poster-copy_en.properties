# Poster copy templates (English). Placeholders {{name}} are filled from the structured facts; never free text.
# A <template>.line.<fact> line is added only when that optional fact was supplied.
urgent.headline=URGENT: {{bloodType}} blood needed
urgent.body={{units}} unit(s) of {{bloodType}} blood are needed at {{hospital}}, {{district}}.
urgent.line.date=Date: {{date}}
urgent.line.time=Time: {{time}}
urgent.line.contactPhone=Contact: {{contactPhone}}
urgent.caption=Urgent: {{bloodType}} blood needed at {{hospital}}, {{district}}. Please share and donate if you can. Contact {{contactPhone}}.
urgent.hashtags=#BloodDonation,#SriLanka,#{{districtTag}},#DonateBlood

camp.headline=Blood donation camp: {{campName}}
camp.body=Join us on {{date}} at {{venue}}, {{district}}. Every eligible donor is welcome.
camp.line.time=Time: {{time}}
camp.line.organiser=Organised by {{organiser}}
camp.line.contactPhone=Contact: {{contactPhone}}
camp.caption=Blood donation camp "{{campName}}" on {{date}} at {{venue}}, {{district}}. Every eligible donor is welcome.
camp.hashtags=#BloodDonation,#DonationCamp,#SriLanka,#{{districtTag}}

