awareness.headline=இரத்தம் கொடுங்கள். நம்பிக்கை கொடுங்கள்.
awareness.body=தன்னார்வ இரத்த கொடையாளர்கள் மருத்துவமனைகளுக்கு இரத்த விநியோகத்தை உறுதி செய்கிறார்கள். நீங்கள் தகுதியுள்ளவரா என்று பார்த்து, அருகிலுள்ள இரத்த வங்கிக்குச் செல்லுங்கள்.
