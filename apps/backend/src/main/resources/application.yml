spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/suwa_sarana_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres123}
  jpa:
    hibernate:
      # Flyway owns all schema changes; Hibernate must never modify the schema.
      # Override with JPA_DDL_AUTO=validate to have Hibernate check entities against the schema at startup.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
    # CRITICAL: Never allow Flyway to DROP the schema in any environment.
    # A migration validation error should be investigated, not auto-resolved by destroying data.
    clean-disabled: true
    clean-on-validation-error: false

# Trust forwarded headers from the reverse proxy so that request.getRemoteAddr()
# returns the real client IP (used for rate limiting and audit logging).
# Only enable this when the application is behind a trusted proxy (nginx, AWS ALB, etc.)
server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LXRvLW1lZXQtam1hYy1yZXF1aXJlbWVudHM=}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app:
  # Refresh-token cookie. Keep secure=true in production (HTTPS). Use SameSite=None only when the
  # frontend and API are on different sites.
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  sms:
    provider-api-key: ${SMS_PROVIDER_API_KEY:mock_key}
    cascade-timeout-seconds: ${SMS_CASCADE_TIMEOUT_SECONDS:180}
  # Set to true ONLY in local development to seed demo test accounts.
  # MUST be false (or unset) in production — seeded accounts use well-known passwords.
  seed-data:
    enabled: ${SEED_DATA_ENABLED:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:166772425992-0dlhn1jn9iutvti95en8sbb8bgng8t7c.apps.googleusercontent.com}

