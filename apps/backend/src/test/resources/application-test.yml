# Fast unit/slice-style integration tests: in-memory H2 in PostgreSQL mode, schema generated by Hibernate, Flyway off.
# This profile is one of the two (dev/test) that may use throw-away secrets; see config/ProductionSafetyCheck.
# Migrations, native SQL and the real schema are covered by the `pgtest` profile (PostgresIntegrationTest).
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

jwt:
  secret: dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LXRvLW1lZXQtam1hYy1yZXF1aXJlbWVudHM=
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

cors:
  allowed-origin: http://localhost:3000

app:
  frontend-url: http://localhost:3000
  public-base-url: http://localhost:8080
  cookie:
    secure: false
